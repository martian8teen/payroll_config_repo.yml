server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**,/api/auth/**

        - id: overpayment-service
          uri: lb://OVERPAYMENT-SERVICE
          predicates:
            - Path=/api/overpayments/**

        - id: case-service
          uri: lb://CASE-SERVICE
          predicates:
            - Path=/api/cases/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

        - id: audit-service
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/api/audit/**

        - id: reporting-service
          uri: lb://REPORTING-SERVICE
          predicates:
            - Path=/api/reports/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
